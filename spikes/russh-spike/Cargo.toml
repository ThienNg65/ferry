[package]
name = "russh-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone throwaway spike: not part of the app build.
[workspace]

[dependencies]
russh = "0.65.1"
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
