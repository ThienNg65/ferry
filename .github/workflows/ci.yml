name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # Needed by actions/upload-artifact + SignPath's signing-request action (Part 2
  # of the dormant signing stage below) — harmless while SIGNPATH_ORGANIZATION_ID
  # is unset, since those steps are skipped entirely.
  actions: read

jobs:
  verify:
    # Prevent infinite recursion from commits made by this workflow
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Cache electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-win-${{ runner.os }}-${{ hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-builder-win-${{ runner.os }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  auto-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-node-deps

      - name: Cache electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-win-${{ runner.os }}-${{ hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-builder-win-${{ runner.os }}-

      - name: Read version
        id: version
        shell: bash
        run: |
          # Ensure we never overwrite an already-published release tag if a previous
          # cycle's version-bump PR on protected `main` has not been merged yet.
          git fetch --tags --force origin
          while git rev-parse -q --verify "refs/tags/v$(node -p "require('./package.json').version")" >/dev/null; do
            echo "Tag v$(node -p "require('./package.json').version") already exists; advancing patch version..."
            npm version patch --no-git-tag-version
          done
          ver=$(node -p "require('./package.json').version")
          node -e "const fs=require('fs');fs.writeFileSync('VERSION',process.argv[1])" "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Finalize changelog
        run: node ./.github/scripts/prepare-release.js

      - name: Commit release changelog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md package.json package-lock.json VERSION

          if git diff --cached --quiet; then
            echo "No changelog changes."
          else
            git commit -m "docs: finalize v${{ steps.version.outputs.version }} changelog"
          fi

      - name: Create tag
        shell: bash
        # Create tag locally. Force flag allows safe retries if previously fetched
        run: git tag -f "v${{ steps.version.outputs.version }}"

      - name: Build and Package with Electron Builder
        shell: bash
        run: |
          npm run build
          # Retry packaging in case of transient CDN/gateway timeouts (e.g. HTTP 504 on toolset downloads)
          max_attempts=3
          attempt=1
          until npx electron-builder --publish never; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::electron-builder packaging failed after $max_attempts attempts."
              exit 1
            fi
            echo "Packaging failed on attempt $attempt. Retrying in 15 seconds..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Generate release notes
        run: node ./.github/scripts/extract-release-notes.js

      - name: Bump next version
        run: npm version patch --no-git-tag-version

      - name: Update VERSION
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');fs.writeFileSync('VERSION',p.version)"

      - name: Prepare next changelog
        run: node ./.github/scripts/prepare-next-version.js

      - name: Commit next development cycle and push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git add package.json package-lock.json VERSION CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Nothing to commit for next cycle."
          else
            git commit -m "chore: start next development cycle"
          fi

          # Push the release tag first
          git push origin "v${{ steps.version.outputs.version }}" --force

          # Push the next development cycle to main. If branch protection requires PRs (GH006),
          # fall back to creating a pull request so the release is not aborted.
          if ! git push origin HEAD:main; then
            echo "Direct push to main was declined by branch protection rule. Creating a pull request instead..."
            pr_branch="chore/bump-to-next-cycle-v${{ steps.version.outputs.version }}"
            git checkout -b "$pr_branch"
            git push origin "$pr_branch" --force
            gh pr create \
              --title "chore: start next development cycle after v${{ steps.version.outputs.version }}" \
              --body "Automated version bump following release of v${{ steps.version.outputs.version }}." \
              --base main \
              --head "$pr_branch" || echo "Warning: PR creation could not be completed automatically."
          fi

      # --- Dormant SignPath signing stage --------------------------------
      # Every step below is gated on SIGNPATH_ORGANIZATION_ID being set, so
      # this whole block is a true no-op until real SignPath credentials
      # exist (see .claude/plan/ferry-smartscreen-signing-plan.md) — nothing
      # to configure here beyond adding the repo variable/secrets once the
      # SignPath OSS application is approved.
      #
      # Placed here (after the push above), not right after the build step,
      # so a lost push race (see the comment on the previous step) never
      # burns a real SignPath signing request on a run that's about to fail
      # anyway — mirrors why commit b6efbcc deferred all GitHub-Release API
      # calls until after push.
      - name: Upload unsigned installer for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/Ferry-Setup-*.exe

      - name: Submit signing request to SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ferry
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Regenerate update metadata for signed binary
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: node ./.github/scripts/regenerate-update-yml.js
      # --- End dormant SignPath signing stage ----------------------------

      - name: Create GitHub Release and Upload Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # nullglob so a signed release's deleted (stale) blockmap doesn't pass
          # through as a literal, non-existent filename (see regenerate-update-yml.js).
          shopt -s nullglob
          assets=(dist/Ferry-Setup-*.exe dist/*.blockmap dist/latest.yml)

          # Since the tag is now pushed to GitHub, we can safely create the release.
          # latest.yml is required by electron-updater's checkForUpdates() to learn
          # a newer version exists at all — omitting it (as this step used to)
          # silently breaks auto-update for every installed client.
          gh release create "v${{ steps.version.outputs.version }}" \
            "${assets[@]}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md || gh release upload "v${{ steps.version.outputs.version }}" "${assets[@]}" --clobber
