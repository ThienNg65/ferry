name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  # Needed by actions/upload-artifact + SignPath's signing-request action (Part 2
  # of the dormant signing stage below) — harmless while SIGNPATH_ORGANIZATION_ID
  # is unset, since those steps are skipped entirely.
  actions: read

jobs:
  verify:
    # Prevent infinite recursion from commits made by this workflow
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  auto-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-node-deps

      - name: Read version
        id: version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Finalize changelog
        run: node ./.github/scripts/prepare-release.js

      - name: Commit release changelog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changelog changes."
          else
            git commit -m "docs: finalize v${{ steps.version.outputs.version }} changelog"
          fi

      - name: Create tag
        shell: bash
        # Create tag locally. We will push it at the end with --follow-tags
        run: git tag "v${{ steps.version.outputs.version }}"

      - name: Build and Package with Electron Builder
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Generate release notes
        run: node ./.github/scripts/extract-release-notes.js

      - name: Bump next version
        run: npm version patch --no-git-tag-version

      - name: Update VERSION
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');fs.writeFileSync('VERSION',p.version)"

      - name: Prepare next changelog
        run: node ./.github/scripts/prepare-next-version.js

      - name: Commit next development cycle and push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add package.json package-lock.json VERSION CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Nothing to commit for next cycle."
          else
            git commit -m "chore: start next development cycle"
          fi
          
          # Try to push everything. If it fails due to a race condition (non-fast-forward),
          # fail the workflow. Since we haven't touched GitHub Releases yet, no rollback is needed!
          if ! git push origin HEAD:main "v${{ steps.version.outputs.version }}"; then
            echo "::error::Push failed! Another commit was merged to main during the build."
            exit 1
          fi

      # --- Dormant SignPath signing stage --------------------------------
      # Every step below is gated on SIGNPATH_ORGANIZATION_ID being set, so
      # this whole block is a true no-op until real SignPath credentials
      # exist (see .claude/plan/ferry-smartscreen-signing-plan.md) — nothing
      # to configure here beyond adding the repo variable/secrets once the
      # SignPath OSS application is approved.
      #
      # Placed here (after the push above), not right after the build step,
      # so a lost push race (see the comment on the previous step) never
      # burns a real SignPath signing request on a run that's about to fail
      # anyway — mirrors why commit b6efbcc deferred all GitHub-Release API
      # calls until after push.
      - name: Upload unsigned installer for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/Ferry-Setup-*.exe

      - name: Submit signing request to SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ferry
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Regenerate update metadata for signed binary
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: node ./.github/scripts/regenerate-update-yml.js
      # --- End dormant SignPath signing stage ----------------------------

      - name: Create GitHub Release and Upload Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # nullglob so a signed release's deleted (stale) blockmap doesn't pass
          # through as a literal, non-existent filename (see regenerate-update-yml.js).
          shopt -s nullglob
          assets=(dist/Ferry-Setup-*.exe dist/*.blockmap dist/latest.yml)

          # Since the tag is now pushed to GitHub, we can safely create the release.
          # latest.yml is required by electron-updater's checkForUpdates() to learn
          # a newer version exists at all — omitting it (as this step used to)
          # silently breaks auto-update for every installed client.
          gh release create "v${{ steps.version.outputs.version }}" \
            "${assets[@]}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
