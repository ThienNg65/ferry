name: CI

on:
  push:
    branches:
      - main
      - refactor/integration
  pull_request:
    branches:
      - main
      - refactor/integration

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Test repository automation scripts
        shell: bash
        run: node --test .github/scripts/*.test.mjs

      - name: Build Neutralino & Sidecar
        run: npm run build

      - name: Install and verify NSIS compiler
        shell: pwsh
        run: |
          choco install nsis.install --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed with exit code $LASTEXITCODE" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) {
            $compiler = Join-Path $env:ProgramFiles 'NSIS\makensis.exe'
          }
          if (-not (Test-Path $compiler)) { throw 'makensis.exe not found after installing NSIS' }
          & $compiler /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis.exe failed its version check' }
          "FERRY_MAKENSIS=$compiler" >> $env:GITHUB_ENV
          "FERRY_REQUIRE_NSIS=1" >> $env:GITHUB_ENV

      - name: Package Neutralino
        run: npm run package

      - name: Verify canonical Neutralino-only distribution
        shell: bash
        run: |
          shopt -s nullglob
          installers=(dist/Ferry-Setup-*.exe)
          zips=(dist/Ferry-Portable-*-win-x64.zip)
          legacy_nl=(dist/Ferry-Neutralino-*)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#zips[@]}" -ne 1 ] || [ ! -s dist/latest.yml ]; then
            echo "::error::Expected one Ferry-Setup-*.exe, one Ferry-Portable-*-win-x64.zip, and nonempty dist/latest.yml."
            exit 1
          fi
          if [ "${#legacy_nl[@]}" -ne 0 ]; then
            echo "::error::Unexpected legacy Ferry-Neutralino-* artifacts found: ${legacy_nl[*]}"
            exit 1
          fi

      - name: Smoke test Neutralino package
        run: npm run smoke:neutralino
