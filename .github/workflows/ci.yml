name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Test repository automation scripts
        shell: bash
        run: node --test .github/scripts/*.test.mjs

      - name: Build Neutralino & Sidecar
        run: npm run build

      - name: Install and verify NSIS compiler
        shell: pwsh
        run: |
          choco install nsis.install --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed with exit code $LASTEXITCODE" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) {
            $compiler = Join-Path $env:ProgramFiles 'NSIS\makensis.exe'
          }
          if (-not (Test-Path $compiler)) { throw 'makensis.exe not found after installing NSIS' }
          & $compiler /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis.exe failed its version check' }
          "FERRY_MAKENSIS=$compiler" >> $env:GITHUB_ENV
          "FERRY_REQUIRE_NSIS=1" >> $env:GITHUB_ENV

      - name: Package Neutralino
        run: npm run package

      - name: Verify canonical Neutralino-only distribution
        shell: bash
        run: |
          shopt -s nullglob
          installers=(dist/Ferry-Setup-*.exe)
          zips=(dist/Ferry-Portable-*-win-x64.zip)
          legacy_nl=(dist/Ferry-Neutralino-*)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#zips[@]}" -ne 1 ] || [ ! -s dist/latest.yml ]; then
            echo "::error::Expected one Ferry-Setup-*.exe, one Ferry-Portable-*-win-x64.zip, and nonempty dist/latest.yml."
            exit 1
          fi
          if [ "${#legacy_nl[@]}" -ne 0 ]; then
            echo "::error::Unexpected legacy Ferry-Neutralino-* artifacts found: ${legacy_nl[*]}"
            exit 1
          fi

      - name: Smoke test Neutralino package
        run: npm run smoke:neutralino


  remote-shell-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Start disposable OpenSSH/SFTP server
        run: |
          docker run -d --name ferry-test-sftp \
            -p 2299:2222 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e PASSWORD_ACCESS=true \
            -e USER_NAME=ferrytest \
            -e USER_PASSWORD=ferrytest123 \
            -e SUDO_ACCESS=false \
            lscr.io/linuxserver/openssh-server@sha256:c8431b8982e7eb3935ebf9c46607d19c6417e39c12ce884cc66945df2e9334e8

      - name: Wait for SSH server
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/2299' 2>/dev/null; then
              echo "SSH/SFTP server is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs ferry-test-sftp
          exit 1

      - name: Wait for SSH test account
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if docker exec ferry-test-sftp id ferrytest >/dev/null 2>&1; then
              echo "SSH test account is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs ferry-test-sftp
          exit 1

      - name: Prepare isolated test directory
        run: docker exec ferry-test-sftp sh -c 'mkdir -p /config/ferry-test && chown ferrytest:"$(id -gn ferrytest)" /config/ferry-test'

      - name: Run required real SSH/SFTP integration suite
        env:
          FERRY_REQUIRE_SSH_INTEGRATION: '1'
        run: npm test -- src/main/ssh/RemoteShell.integration.test.ts

      - name: Remove disposable SSH/SFTP server
        if: always()
        run: docker rm --force ferry-test-sftp || true
