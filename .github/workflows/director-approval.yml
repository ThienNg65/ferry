name: Director Approval Gate

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: director-approval-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  record-director-decision:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Validate the Director signature and release the exact gate
        uses: actions/github-script@v7
        with:
          script: |
            const isReview = context.eventName === "pull_request_review";
            const item = isReview ? context.payload.pull_request : context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = item.number;
            const actor = context.actor.toLowerCase();
            const director = owner.toLowerCase();

            if (actor !== director) {
              core.notice("Decision ignored: only the repository owner/Director can approve this gate.");
              return;
            }

            const metadata = (item.title || "") + "\n" + (item.body || "");
            const marker = metadata.match(/(?:approval id\s*:\s*|tl-apr\s*:\s*)\[?(APR-[A-Z0-9-]+)\]?/i);
            if (!marker) {
              core.notice("No unique APR approval marker found on this item.");
              return;
            }
            const approvalId = marker[1].toUpperCase();

            const labelsResponse = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const labels = new Set(labelsResponse.data.map((label) => label.name));
            if (!labels.has("approval:required")) {
              core.notice("Approval gate is not pending; no action taken.");
              return;
            }
            if (!labels.has("phase:director-approval")) {
              core.setFailed("Approval marker exists without phase:director-approval.");
              return;
            }

            let decision = null;
            let submittedText = "";
            if (isReview) {
              if (String(context.payload.review.state).toLowerCase() !== "approved") {
                core.notice("Only an APPROVED review releases the Director gate; other review states leave it pending.");
                return;
              }
              decision = "approved";
              submittedText = "GitHub pull-request review: APPROVED";
            } else {
              const comment = context.payload.comment.body || "";
              const approve = comment.match(/^(?:\/approve|APPROVED:)\s*(APR-[A-Z0-9-]+)\s*$/im);
              const reject = comment.match(/^(?:\/reject|REJECTED:)\s*(APR-[A-Z0-9-]+)\s*$/im);
              if (approve) {
                decision = "approved";
                submittedText = approve[0].trim();
                if (approve[1].toUpperCase() !== approvalId) {
                  core.setFailed("Approval comment APR ID does not match this checkpoint.");
                  return;
                }
              } else if (reject) {
                decision = "rejected";
                submittedText = reject[0].trim();
                if (reject[1].toUpperCase() !== approvalId) {
                  core.setFailed("Rejection comment APR ID does not match this checkpoint.");
                  return;
                }
              } else {
                core.notice("No explicit /approve APR-ID or /reject APR-ID command found.");
                return;
              }
            }

            const decisionLabel = decision === "approved" ? "approval:approved" : "approval:rejected";
            const oppositeLabel = decision === "approved" ? "approval:rejected" : "approval:approved";
            if (labels.has(oppositeLabel)) {
              core.setFailed("Conflicting Director decision already exists for " + approvalId + ".");
              return;
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            await ensureLabel("approval:approved", "0E8A16", "Director approved this exact checkpoint.");
            await ensureLabel("approval:rejected", "D93F0B", "Director rejected this exact checkpoint.");
            await ensureLabel("automation:queued", "FBCA04", "Queued for the ThienLabs agent runner.");

            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "approval:required" });
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [decisionLabel].concat(decision === "approved" ? ["automation:queued"] : [])
            });

            const taskId = approvalId.replace(/^APR-/, "");
            const timestamp = new Date().toISOString();
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: decision === "approved"
                ? "## Director approval recorded\n\n- Approval: " + approvalId + "\n- Signed by: @" + context.actor + "\n- Evidence: " + submittedText + "\n- Status: automation:queued\n\nThe exact checkpoint has been released. A continuation event has been emitted; CI, branch protection, and any separate approval gates remain in force."
                : "## Director decision recorded\n\n- Approval: " + approvalId + "\n- Signed by: @" + context.actor + "\n- Evidence: " + submittedText + "\n- Status: approval:rejected\n\nThe workflow remains stopped for this task. No continuation event will run."
            });

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "thienlabs-director-decision",
              client_payload: {
                event_version: 1,
                approval_id: approvalId,
                task_id: taskId,
                decision,
                director: context.actor,
                issue_number,
                target_url: item.html_url,
                timestamp
              }
            });
            core.notice("Recorded " + decision + " for " + approvalId + " and emitted the ThienLabs decision event.");
