name: Build MSIX

on:
  workflow_dispatch:
    inputs:
      run_wack:
        description: Also run the Windows App Certification Kit
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/msix.yml'
      - 'build/msix/**'
      - 'scripts/pack-msix.mjs'
      - 'scripts/verify-msix.py'
      - 'scripts/test-msix-certification.ps1'

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Build and pack MSIX
        run: npm run package:msix

      - name: Validate Store package and publish its SHA-256
        shell: pwsh
        run: |
          python scripts/verify-msix.py --report dist/msix-validation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content dist/msix-validation.json -Raw | ConvertFrom-Json
          @"
          ### Verified Store MSIX

          | File | Bytes | SHA-256 |
          | --- | ---: | --- |
          | $($report.file) | $($report.bytes) | $($report.sha256) |
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Smoke test the installed MSIX
        env:
          RUN_WACK: ${{ inputs.run_wack }}
        shell: pwsh
        run: |
          $report = Get-Content dist/msix-validation.json -Raw | ConvertFrom-Json
          $testOptions = @{ PackagePath = "dist/$($report.file)" }
          if ($env:RUN_WACK -eq 'true') { $testOptions.ReportPath = 'dist/wack-report.xml' }
          ./scripts/test-msix-certification.ps1 @testOptions

      - name: Upload validation reports
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: ferry-msix-validation
          path: |
            dist/msix-validation.json
            dist/wack-report.xml
          if-no-files-found: ignore

      - name: Upload verified Store MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ferry-msix-win-x64
          path: dist/FerryFileClient-*.msix
          if-no-files-found: error
